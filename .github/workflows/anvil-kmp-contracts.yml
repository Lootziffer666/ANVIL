name: anvil-kmp contracts

on:
  push:
    paths:
      - "anvil-kmp/**"
      - ".github/workflows/anvil-kmp-contracts.yml"
  pull_request:
    paths:
      - "anvil-kmp/**"
      - ".github/workflows/anvil-kmp-contracts.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anvil-kmp
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: core:contracts allTests
        run: ./gradlew :core:contracts:allTests --console=plain

      - name: core:artifacts allTests
        run: ./gradlew :core:artifacts:allTests --console=plain

      - name: core:run allTests
        run: ./gradlew :core:run:allTests --console=plain

      - name: core:handoff allTests
        run: ./gradlew :core:handoff:allTests --console=plain

      - name: core:sync allTests
        run: ./gradlew :core:sync:allTests --console=plain

      - name: modules:gameplay allTests
        run: ./gradlew :modules:gameplay:allTests --console=plain

      - name: modules:scene allTests
        run: ./gradlew :modules:scene:allTests --console=plain

      - name: modules:interface allTests
        run: ./gradlew :modules:interface:allTests --console=plain

      - name: modules:acoustic allTests
        run: ./gradlew :modules:acoustic:allTests --console=plain

      - name: modules:target allTests
        run: ./gradlew :modules:target:allTests --console=plain

      - name: surfaces:golden-run allTests (Gate I)
        run: ./gradlew :surfaces:golden-run:allTests --console=plain
