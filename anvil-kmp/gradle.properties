# ANVIL KMP — Gradle Properties
# Gate B9: Bellows Gateway (Produktionsreife)

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Kotlin Multiplatform: keine Warnung wegen AGP-Kompatibilität (Android ist opt-in).
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# ── Android-Target ist OPT-IN ──────────────────────────────────────────────────
# Default OFF, damit das Projekt auf JVM/Windows OHNE Android-SDK baut.
# Mit installiertem Android-SDK aktivieren via:  -Panvil.android=true
anvil.android=false
